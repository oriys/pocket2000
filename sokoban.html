<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>推箱子 · SOKO-BAN 2000</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(140% 120% at 50% 38%, #a4c31d 0%, #9bbc0f 55%, #83a40d 100%);
    color: #0f380f;
    font-family: "PingFang SC", "Microsoft YaHei", ui-monospace, Menlo, monospace;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }

  /* ---------- 全屏 LCD ---------- */
  .screen {
    position: fixed; inset: 0 0 32px 0;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .hintbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 32px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-size: 12px; color: rgba(15,56,15,.72); letter-spacing: .03em;
    padding: 0 12px; white-space: nowrap; overflow: hidden;
  }
  .hintbar b { color: #0f380f; font-weight: 600; }
  .hintbar .sep { opacity: .45; }

  /* ---------- level select modal ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(8, 9, 13, .78); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal[hidden] { display: none; }
  .panel {
    width: min(780px, 100%); max-height: 86vh; display: flex; flex-direction: column;
    background: #1d1f27; border: 1px solid #343741; border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    overflow: hidden;
  }
  .panel header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; }
  .panel header h2 { font-size: 15px; color: #d8dce8; font-weight: 600; }
  .panel header button { border: 0; background: none; color: #7c8396; font-size: 20px; cursor: pointer; padding: 2px 8px; }
  .tabs { display: flex; gap: 6px; padding: 0 16px 12px; flex-wrap: wrap; }
  .tabs button {
    border: 1px solid #343741; background: #23252d; color: #9aa1b3;
    border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .tabs button.active { background: #2f4a1e; border-color: #59822f; color: #cfe8a0; }
  .grid {
    overflow-y: auto; padding: 4px 16px 16px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px;
  }
  .grid button {
    position: relative; border: 1px solid #343741; border-radius: 9px;
    background: #23252d; color: #aeb4c4; font-size: 12px; padding: 7px 5px 6px;
    cursor: pointer; font-family: inherit; line-height: 1.2;
  }
  .grid button canvas {
    display: block; margin: 0 auto 5px; width: 100%; height: auto;
    background: #9bbc0f; border-radius: 4px;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  .grid button small { display: block; font-size: 10px; color: #6d7487; margin-top: 2px; }
  .grid button.done { background: #24371a; border-color: #4a6d2a; color: #b9e07e; }
  .grid button.done small { color: #86a45c; }
  .grid button.cur { outline: 2px solid #a9d64c; outline-offset: 1px; }
  .panel footer { padding: 10px 16px 14px; font-size: 11px; color: #5b6172; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panel footer .credit { width: 100%; font-size: 10px; color: #464c5c; }
  .panel footer .danger { border: 0; background: none; color: #8a5560; cursor: pointer; font-size: 11px; text-decoration: underline; font-family: inherit; }

  @media (max-width: 640px) {
    .hintbar .keysHint, .hintbar .sep { display: none; }
  }
</style>
</head>
<body>
<div class="screen" id="screen"><canvas id="lcd"></canvas></div>
<div class="hintbar">
  <span id="status">加载中…</span>
  <span class="sep">｜</span>
  <span class="keysHint">方向键 / WASD 移动 · Z 撤销 · R 重开 · N / P 切关 · L 选关 · F 全屏 · M 音效 · Esc 菜单</span>
</div>

<div class="modal" id="modal" hidden>
  <div class="panel">
    <header>
      <h2>选择关卡</h2>
      <button id="modalClose" aria-label="关闭">✕</button>
    </header>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
    <footer>
      <span id="progressNote"></span>
      <button class="danger" id="resetProgress">清空全部进度</button>
      <span class="credit">关卡：Original &amp; Extra ×90（Thinking Rabbit，经 xsokoban 流传）· Microban ×155（David W. Skinner，可自由分发）</span>
    </footer>
  </div>
</div>

/* ============================================================
 * 引擎（纯逻辑，无 DOM）
 * ============================================================ */
const SOKO = (() => {
  const K = (x, y) => x + "," + y;
  const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };

  function parseLevel(text) {
    const rows = text.split("\n");
    const h = rows.length;
    const w = Math.max(...rows.map(r => r.length));
    const wall = new Set(), goal = new Set(), boxes = new Set();
    let player = null;
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const ch = row[x];
        if (ch === "#") wall.add(K(x, y));
        if (ch === "." || ch === "*" || ch === "+") goal.add(K(x, y));
        if (ch === "$" || ch === "*") boxes.add(K(x, y));
        if (ch === "@" || ch === "+") player = { x, y };
      }
    });
    // 地板 = 从玩家、每个箱子、每个目标点多源泛洪（个别关卡有封闭的装饰密室）
    const interior = new Set();
    const q = [];
    const seed = (x, y) => { const k = K(x, y); if (!interior.has(k) && !wall.has(k)) { interior.add(k); q.push([x, y]); } };
    seed(player.x, player.y);
    for (const b of boxes) { const [x, y] = b.split(",").map(Number); seed(x, y); }
    for (const g of goal) { const [x, y] = g.split(",").map(Number); seed(x, y); }
    while (q.length) {
      const [x, y] = q.pop();
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        seed(nx, ny);
      }
    }
    return { w, h, wall, goal, interior, startPlayer: player, startBoxes: boxes };
  }

  function newState(lvl) {
    return {
      px: lvl.startPlayer.x, py: lvl.startPlayer.y,
      boxes: new Set(lvl.startBoxes),
      moves: 0, pushes: 0, undo: [],
    };
  }

  // 返回 "wall" | "blocked" | "move" | "push"
  function tryMove(lvl, st, dx, dy) {
    const nx = st.px + dx, ny = st.py + dy;
    const nk = K(nx, ny);
    if (lvl.wall.has(nk)) return "wall";
    if (st.boxes.has(nk)) {
      const bk = K(nx + dx, ny + dy);
      if (lvl.wall.has(bk) || st.boxes.has(bk)) return "blocked";
      st.boxes.delete(nk);
      st.boxes.add(bk);
      st.undo.push({ px: st.px, py: st.py, boxFrom: nk, boxTo: bk });
      st.px = nx; st.py = ny;
      st.moves++; st.pushes++;
      return "push";
    }
    st.undo.push({ px: st.px, py: st.py });
    st.px = nx; st.py = ny;
    st.moves++;
    return "move";
  }

  function undoMove(st) {
    const u = st.undo.pop();
    if (!u) return false;
    if (u.boxTo) {
      st.boxes.delete(u.boxTo);
      st.boxes.add(u.boxFrom);
      st.pushes--;
    }
    st.px = u.px; st.py = u.py;
    st.moves--;
    return true;
  }

  function isWin(lvl, st) {
    for (const b of st.boxes) if (!lvl.goal.has(b)) return false;
    return true;
  }

  return { K, DIRS, parseLevel, newState, tryMove, undoMove, isWin };
})();

/* ============================================================
 * Game Boy 四色调色板 + 程序化像素贴图
 * ============================================================ */
const PAL = ["#9bbc0f", "#8bac0f", "#306230", "#0f380f"]; // 0 最亮 … 3 最暗
const T = 16;               // 贴图边长（native 像素）
const HUD_H = 14;
const MIN_COLS = 12;

function makeTile(draw) {
  const c = document.createElement("canvas");
  c.width = T; c.height = T;
  const g = c.getContext("2d");
  draw({
    px(x, y, col) { g.fillStyle = PAL[col]; g.fillRect(x, y, 1, 1); },
    fill(col) { g.fillStyle = PAL[col]; g.fillRect(0, 0, T, T); },
  });
  return c;
}

function fromArt(rows) { // '.' 透明，'0'-'3' 调色板
  return makeTile(t => {
    for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) {
      const ch = rows[y][x];
      if (ch !== ".") t.px(x, y, +ch);
    }
  });
}

const TILES = {};

TILES.floor = makeTile(t => {
  t.fill(0);
  t.px(3, 3, 1); t.px(11, 11, 1);
});

TILES.wall = makeTile(t => {
  for (let y = 0; y < T; y++) {
    const course = (y / 4) | 0, yy = y % 4;
    for (let x = 0; x < T; x++) {
      const joint = ((x + (course % 2 ? 4 : 0)) % 8) === 0;
      t.px(x, y, (yy === 0 || joint) ? 3 : (yy === 3 ? 2 : 1));
    }
  }
});

TILES.goal = makeTile(t => {
  t.fill(0);
  t.px(3, 3, 1); t.px(11, 11, 1);
  for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) {
    const d = Math.abs(x - 7.5) + Math.abs(y - 7.5);
    if (d < 3) t.px(x, y, 1);
    else if (d < 4.5) t.px(x, y, 2);
  }
});

function buildBox(onGoal) {
  return makeTile(t => {
    const face = onGoal ? 2 : 1, hi = onGoal ? 1 : 0, lo = onGoal ? 3 : 2, diag = onGoal ? 0 : 2;
    for (let y = 1; y < 15; y++) for (let x = 1; x < 15; x++) t.px(x, y, face);
    for (let i = 0; i < 16; i++) { t.px(i, 0, 3); t.px(i, 15, 3); t.px(0, i, 3); t.px(15, i, 3); }
    for (let i = 1; i < 15; i++) { t.px(i, 1, hi); t.px(1, i, hi); t.px(i, 14, lo); t.px(14, i, lo); }
    for (let i = 3; i < 13; i++) { t.px(i, i, diag); t.px(15 - i, i, diag); }
    t.px(2, 2, 3); t.px(13, 2, 3); t.px(2, 13, 3); t.px(13, 13, 3);
  });
}

    gn.gain.setValueAtTime(vol || 0.04, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  return {
    unlock: ensure,
    move()  { tone(840, 0.04); },
    push()  { tone(330, 0.06, 0, "square", 0.05); },
    bump()  { tone(100, 0.06, 0, "sawtooth", 0.05); },
    undo()  { tone(520, 0.04); tone(390, 0.04, 0.05); },
    select(){ tone(660, 0.05); },
    win()   { [659, 784, 988, 1319].forEach((f, i) => tone(f, 0.12, i * 0.09, "square", 0.05)); },
  };
})();

/* ============================================================
 * 存档
 * ============================================================ */
const STORE_KEY = "sokoban2000_v1";
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
}
const store = loadStore();
store.best = store.best || {};          // best[setId][idx] = [moves, pushes]
store.pos = store.pos || { set: 0, idx: 0 };

/* ============================================================
 * 游戏主体
 * ============================================================ */
const cv = document.getElementById("lcd");
const g2 = cv.getContext("2d");
const screenBox = document.getElementById("screen");
const statusEl = document.getElementById("status");

const game = {
  setIdx: 0, lvlIdx: 0,
  lvl: null, st: null,
  facing: "D",
  won: false,
  newBest: false,
  blink: true,
  muted: (function(){ try { return localStorage.getItem("hh_muted") === "1"; } catch (e) { return !!store.muted; } })(),
};

let blinkTimer = null;

function levelCount(si) { return SETS[si].levels.length; }
function bestOf(si, li) {
  const b = store.best[SETS[si].id];
  return b && b[li] ? b[li] : null;
}
function doneCount(si) {
  const b = store.best[SETS[si].id];
  return b ? Object.keys(b).length : 0;
}

function loadLevel(si, li, keepFacing) {
  game.setIdx = si; game.lvlIdx = li;
  game.lvl = SOKO.parseLevel(SETS[si].levels[li]);
  game.st = SOKO.newState(game.lvl);
  if (!keepFacing) game.facing = "D";
  game.won = false; game.newBest = false;
  store.pos = { set: si, idx: li };
  saveStore();
  clearInterval(blinkTimer); blinkTimer = null;
  layout();
  render();
  updateStatus();
}

function updateStatus() {
  const s = SETS[game.setIdx];
  statusEl.innerHTML =
    "<b>" + s.name + "</b> · 第 " + (game.lvlIdx + 1) + " / " + s.levels.length + " 关" +
    " · 已完成 <b>" + doneCount(game.setIdx) + "</b> 关" +
    (game.muted ? " · 已静音" : "");
}

/* ---------- 渲染 ---------- */
function nativeSize() {
  const w = Math.max(game.lvl.w, MIN_COLS) * T;
  const h = game.lvl.h * T + HUD_H + 2;
  return [w, h];
}
function layout() {
  const [nw, nh] = nativeSize();
  cv.width = nw; cv.height = nh;
  const availW = screenBox.clientWidth - 8;
  const availH = screenBox.clientHeight - 8;
  let scale = Math.min(availW / nw, availH / nh);
  if (scale >= 1) scale = Math.floor(scale);
  cv.style.width = (nw * scale) + "px";
  cv.style.height = (nh * scale) + "px";
}

function render() {
  const lvl = game.lvl, st = game.st;
  const [nw, nh] = nativeSize();
  g2.fillStyle = PAL[0];
  g2.fillRect(0, 0, nw, nh);

  // HUD
  const setTag = SETS[game.setIdx].short;
  drawText(g2, setTag + " " + String(game.lvlIdx + 1).padStart(3, "0"), 3, 4, 3);
  const right = "M" + String(st.moves).padStart(4, "0") + " P" + String(st.pushes).padStart(3, "0");
  drawText(g2, right, nw - textW(right, 1) - 3, 4, 3);
  const best = bestOf(game.setIdx, game.lvlIdx);
  if (best) drawText(g2, "*", (nw - 4) / 2, 4, 2);
  g2.fillStyle = PAL[2];
  g2.fillRect(0, HUD_H - 2, nw, 1);

  // 棋盘
  const ox = Math.floor((nw - lvl.w * T) / 2);
  const oy = HUD_H;
  const K = SOKO.K;
  for (let y = 0; y < lvl.h; y++) {
    for (let x = 0; x < lvl.w; x++) {
      const k = K(x, y);
      const dx = ox + x * T, dy = oy + y * T;
      if (lvl.wall.has(k)) g2.drawImage(TILES.wall, dx, dy);
      else if (lvl.interior.has(k)) {
        g2.drawImage(lvl.goal.has(k) ? TILES.goal : TILES.floor, dx, dy);
      }
    }
  }
  for (const b of st.boxes) {
    const [x, y] = b.split(",").map(Number);
    g2.drawImage(lvl.goal.has(b) ? TILES.boxDone : TILES.box, ox + x * T, oy + y * T);
  }
  g2.drawImage(TILES["player" + game.facing], ox + st.px * T, oy + st.py * T);

  // 过关横幅
  if (game.won) {
    const bw = Math.min(nw - 8, 120), bh = 46;
    const bx = Math.floor((nw - bw) / 2), by = Math.floor((nh - bh) / 2);
    g2.fillStyle = PAL[0]; g2.fillRect(bx, by, bw, bh);
    g2.fillStyle = PAL[3]; g2.fillRect(bx, by, bw, 1); g2.fillRect(bx, by + bh - 1, bw, 1);
    g2.fillRect(bx, by, 1, bh); g2.fillRect(bx + bw - 1, by, 1, bh);
    g2.fillStyle = PAL[2]; g2.fillRect(bx + 2, by + 2, bw - 4, 1); g2.fillRect(bx + 2, by + bh - 3, bw - 4, 1);
    let t = "CLEAR!";
    drawText(g2, t, Math.floor((nw - textW(t, 2)) / 2), by + 6, 3, 2);
    t = "M " + st.moves + "  P " + st.pushes + (game.newBest ? "  *BEST*" : "");
    drawText(g2, t, Math.floor((nw - textW(t, 1)) / 2), by + 22, 3);
    if (game.blink) {
      t = "> PRESS ANY KEY";
      drawText(g2, t, Math.floor((nw - textW(t, 1)) / 2), by + 34, 2);
    }
  }
}

/* ---------- 胜利 ---------- */
function handleWin() {
  game.won = true;
  const sid = SETS[game.setIdx].id;
  store.best[sid] = store.best[sid] || {};
  const prev = store.best[sid][game.lvlIdx];
  if (!prev || game.st.moves < prev[0] || (game.st.moves === prev[0] && game.st.pushes < prev[1])) {
    store.best[sid][game.lvlIdx] = [game.st.moves, game.st.pushes];
    game.newBest = !!prev;
  }
  saveStore();
  SND.win();
  updateStatus();
  game.blink = true;
  blinkTimer = setInterval(() => { game.blink = !game.blink; render(); }, 480);
  render();
}

function nextLevel(delta) {
  const n = levelCount(game.setIdx);
  loadLevel(game.setIdx, ((game.lvlIdx + delta) % n + n) % n);
}

/* ---------- 输入 ---------- */
function doMove(dirName) {
  if (game.won) { nextLevel(1); return; }
  const [dx, dy] = SOKO.DIRS[dirName];
  game.facing = dirName;
  const r = SOKO.tryMove(game.lvl, game.st, dx, dy);
  if (r === "move") SND.move();
  else if (r === "push") SND.push();
  else SND.bump();
  render();
  if ((r === "move" || r === "push") && SOKO.isWin(game.lvl, game.st)) handleWin();
}

function doUndo() {
  if (game.won) return;
  if (SOKO.undoMove(game.st)) { SND.undo(); render(); }
  else SND.bump();
}

function doRestart() {
  SND.select();
  loadLevel(game.setIdx, game.lvlIdx);
}

function toggleMute() {
  game.muted = !game.muted;
  store.muted = game.muted;
  try { localStorage.setItem("hh_muted", game.muted ? "1" : "0"); } catch (e) {}
  saveStore();
  updateStatus();
  if (!game.muted) SND.select();
}

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function toggleFullscreen() {
  if (isFullscreen()) {
    (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
  } else {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) req.call(el);
  }
}
["fullscreenchange", "webkitfullscreenchange"].forEach(ev =>
  document.addEventListener(ev, () => { layout(); render(); }));

const KEYMAP = {
  ArrowUp: "U", ArrowDown: "D", ArrowLeft: "L", ArrowRight: "R",
  w: "U", s: "D", a: "L", d: "R", W: "U", S: "D", A: "L", D: "R",
};

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  SND.unlock();
  const modalOpen = !modal.hidden;
  if (modalOpen) {
    if (e.key === "Escape" || e.key === "l" || e.key === "L") { closeModal(); e.preventDefault(); }
    return;
  }
  if (game.won) {
    e.preventDefault();
    if (e.key === "f" || e.key === "F") { toggleFullscreen(); return; }
    if (e.key === "Escape") { if (!isFullscreen()) location.href = "./"; return; }
    if (e.key === "m" || e.key === "M") { toggleMute(); return; }
    if (e.key === "p" || e.key === "P") nextLevel(-1); else nextLevel(1);
    return;
  }
  const dir = KEYMAP[e.key];
  if (dir) { e.preventDefault(); doMove(dir); return; }
  switch (e.key) {
    case "z": case "Z": case "u": case "U": case "Backspace": e.preventDefault(); doUndo(); break;
    case "r": case "R": e.preventDefault(); doRestart(); break;
    case "n": case "N": case "]": e.preventDefault(); SND.select(); nextLevel(1); break;
    case "p": case "P": case "[": e.preventDefault(); SND.select(); nextLevel(-1); break;
    case "l": case "L": e.preventDefault(); openModal(); break;
    case "Escape":
      e.preventDefault();
      if (!isFullscreen()) location.href = "./"; // 返回掌机菜单；全屏时先交给浏览器退全屏
      break;
    case "f": case "F": e.preventDefault(); toggleFullscreen(); break;
    case "m": case "M": e.preventDefault(); toggleMute(); break;
  }
});

/* 屏幕滑动（触屏备用） */
(() => {
  let sx = 0, sy = 0, active = false;
  screenBox.addEventListener("pointerdown", e => {
    SND.unlock(); sx = e.clientX; sy = e.clientY; active = true;
  });
  screenBox.addEventListener("pointerup", e => {
    if (!active) return; active = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) {
      if (game.won) nextLevel(1);
      return;
    }
    doMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "R" : "L") : (dy > 0 ? "D" : "U"));
  });
})();

/* ---------- 选关面板 ---------- */
const modal = document.getElementById("modal");
const tabsEl = document.getElementById("tabs");
const gridEl = document.getElementById("grid");
let modalSet = 0;

/* 关卡缩略图：墙=深绿块 目标=浅绿块 箱子=最深实心块 玩家=半格小点 */
const THUMB_W = 96, THUMB_H = 60;
const thumbCache = {};
function makeThumb(si, li) {
  thumbCache[si] = thumbCache[si] || {};
  if (thumbCache[si][li]) return thumbCache[si][li];
  const lvl = SOKO.parseLevel(SETS[si].levels[li]);
  const c = document.createElement("canvas");
  c.width = THUMB_W; c.height = THUMB_H;
  const g = c.getContext("2d");
  g.fillStyle = PAL[0]; g.fillRect(0, 0, THUMB_W, THUMB_H);
  const s = Math.max(1, Math.min(5, Math.floor(Math.min(THUMB_W / lvl.w, THUMB_H / lvl.h))));
  const ox = Math.floor((THUMB_W - lvl.w * s) / 2);
  const oy = Math.floor((THUMB_H - lvl.h * s) / 2);
  const K = SOKO.K;
  for (let y = 0; y < lvl.h; y++) for (let x = 0; x < lvl.w; x++) {
    const k = K(x, y);
    let col = null;
    if (lvl.wall.has(k)) col = 2;
    else if (lvl.goal.has(k)) col = 1;
    if (col !== null) { g.fillStyle = PAL[col]; g.fillRect(ox + x * s, oy + y * s, s, s); }
  }
  g.fillStyle = PAL[3];
  for (const b of lvl.startBoxes) {
    const [x, y] = b.split(",").map(Number);
    g.fillRect(ox + x * s, oy + y * s, s, s);
  }
  const p = lvl.startPlayer, ps = Math.max(1, Math.ceil(s / 2)), po = Math.floor((s - ps) / 2);
  g.fillStyle = PAL[3];
  g.fillRect(ox + p.x * s + po, oy + p.y * s + po, ps, ps);
  thumbCache[si][li] = c;
  return c;
}

function openModal() {
  if (isFullscreen()) toggleFullscreen(); // 弹层在全屏元素之外，先退出全屏
  modalSet = game.setIdx;
  renderModal();
  modal.hidden = false;
}
function closeModal() { modal.hidden = true; }

function renderModal() {
  tabsEl.innerHTML = "";
  SETS.forEach((s, si) => {
    const b = document.createElement("button");
    b.textContent = s.name + " " + doneCount(si) + "/" + s.levels.length;
    if (si === modalSet) b.classList.add("active");
    b.addEventListener("click", () => { modalSet = si; renderModal(); });
    tabsEl.appendChild(b);
  });
  gridEl.innerHTML = "";
  const s = SETS[modalSet];
  s.levels.forEach((_, li) => {
    const b = document.createElement("button");
    const best = bestOf(modalSet, li);
    b.appendChild(makeThumb(modalSet, li));
    const lab = document.createElement("small");
    lab.textContent = "第 " + (li + 1) + " 关" + (best ? " · " + best[0] + " 步" : "");
    b.appendChild(lab);
    if (best) b.classList.add("done");
    if (modalSet === game.setIdx && li === game.lvlIdx) b.classList.add("cur");
    if (s.titles && s.titles[li]) b.title = s.titles[li];
    b.addEventListener("click", () => { SND.select(); closeModal(); loadLevel(modalSet, li); });
    gridEl.appendChild(b);
  });
  const total = SETS.reduce((a, s2) => a + s2.levels.length, 0);
  const done = SETS.reduce((a, _, si) => a + doneCount(si), 0);
  document.getElementById("progressNote").textContent = "总进度 " + done + " / " + total;
}

document.getElementById("modalClose").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.getElementById("resetProgress").addEventListener("click", () => {
  if (confirm("确定清空所有过关记录吗？此操作不可恢复。")) {
    store.best = {};
    saveStore();
    renderModal();
    updateStatus();
  }
});

/* ---------- 启动 ---------- */
window.addEventListener("resize", () => { layout(); render(); });
{
  let { set, idx } = store.pos;
  if (!(set >= 0 && set < SETS.length)) set = 0;
  if (!(idx >= 0 && idx < levelCount(set))) idx = 0;
  loadLevel(set, idx);
}
</script>
