<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>POCKET 2000 · 怀旧掌机</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(140% 120% at 50% 38%, #a4c31d 0%, #9bbc0f 55%, #83a40d 100%);
    color: #0f380f;
    font-family: "PingFang SC", "Microsoft YaHei", ui-monospace, Menlo, monospace;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .wrap {
    position: fixed; inset: 0 0 32px 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; padding: 20px;
  }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .logo canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  .logo .sub { font-size: 14px; letter-spacing: .5em; text-indent: .5em; color: rgba(15,56,15,.75); font-weight: 700; }

  .menu { display: flex; flex-direction: column; gap: 10px; width: min(460px, 92vw); }
  .item {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 14px; border-radius: 10px; cursor: pointer;
    border: 3px solid transparent;
  }
  .item.sel {
    border-color: #0f380f;
    background: rgba(15,56,15,.1);
    box-shadow: inset 0 0 0 2px rgba(155,188,15,.6), 0 4px 0 rgba(15,56,15,.22);
  }
  .item canvas { image-rendering: pixelated; flex: none; border: 3px solid #0f380f; border-radius: 8px; background: #8bac0f; }
  .item .txt { flex: 1; min-width: 0; }
  .item .name { font-size: 17px; font-weight: 700; letter-spacing: .06em; }
  .item .name .en { font-size: 11px; font-weight: 400; letter-spacing: .12em; opacity: .55; margin-left: 8px; }
  .item .sub { font-size: 12px; color: rgba(15,56,15,.7); margin-top: 3px; }
  .item .marker { font-size: 16px; visibility: hidden; }
  .item.sel .marker { visibility: visible; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .credit { font-size: 11px; color: rgba(15,56,15,.5); text-align: center; line-height: 1.7; }

  .hintbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 32px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-size: 12px; color: rgba(15,56,15,.72); letter-spacing: .03em;
    padding: 0 12px; white-space: nowrap; overflow: hidden;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <canvas id="logoCv"></canvas>
    <div class="sub">怀旧掌机 · 益智合集</div>
  </div>
  <div class="menu" id="menu"></div>
  <div class="credit">
    Game Boy 四色绿屏 · 纯 HTML 单文件系列 · 进度保存在本机浏览器<br>
    关卡致谢：Thinking Rabbit / xsokoban · David W. Skinner (Microban) · jeantimex/klotski (MIT)
  </div>
</div>
<div class="hintbar">
  <span>↑ ↓ 选择 · Enter / 空格 进入 · F 全屏 · M 音效</span>
</div>

<script>
"use strict";
const PAL = ["#9bbc0f", "#8bac0f", "#306230", "#0f380f"];
const FONT = {
  "0":"111101101101111","2":"111001111100111","A":"010101111101101","B":"110101110101110",
  "K":"101110100110101","N":"110101101101101","O":"010101101101010","S":"011100010001110",
  "-":"000000111000000"," ":"000000000000000","P":"110101110100100","C":"011100100100011","E":"111100110100111","T":"111010010010010",
};
function drawText(g, str, x, y, col, scale) {
  g.fillStyle = PAL[col];
  for (const ch of str) {
    const bits = FONT[ch] || FONT[" "];
    for (let i = 0; i < 15; i++) {
      if (bits[i] === "1") g.fillRect(x + (i % 3) * scale, y + ((i / 3) | 0) * scale, scale, scale);
    }
    x += 4 * scale;
  }
}

/* ---------- 音效 ---------- */
let muted = (function () { try { return localStorage.getItem("hh_muted") === "1"; } catch (e) { return false; } })();
const SND = (() => {
  let ctx = null;
  function ensure() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, dur, delay, vol) {
    const c = ensure(); if (!c || muted) return;
    const t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator(), gn = c.createGain();
    o.type = "square"; o.frequency.value = freq;
    gn.gain.setValueAtTime(vol || 0.04, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  return {
    unlock: ensure,
    nav()   { tone(880, 0.03); },
    enter() { tone(660, 0.07); tone(990, 0.09, 0.07); },
  };
})();

/* ---------- LOGO ---------- */
(() => {
  const cv = document.getElementById("logoCv");
  const g = cv.getContext("2d");
  const text = "POCKET 2000", s = 4;
  cv.width = text.length * 4 * s;
  cv.height = 5 * s + 4;
  cv.style.width = Math.min(text.length * 4 * s * 2, Math.floor(window.innerWidth * 0.86)) + "px";
  drawText(g, text, 1, 3, 3, s);
  drawText(g, text, 0, 2, 2, s);
  drawText(g, text, 0, 0, 3, s); // 主体 + 阴影错位，做出立体字
})();

/* ---------- 各游戏进度 ---------- */
function readJSON(key) { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; } }
function sokoProgress() {
  const s = readJSON("sokoban2000_v1");
  let n = 0;
  if (s.best) for (const k in s.best) n += Object.keys(s.best[k]).length;
  return "经典 245 关" + (n ? " · 已完成 " + n : "");
}
function klotskiProgress() {
  const s = readJSON("klotski_v1");
  const n = s.best ? Object.keys(s.best).length : 0;
  return "39 局经典开局" + (n ? " · 已解开 " + n : " · 横刀立马等你");
}
function fifteenProgress() {
  const s = readJSON("fifteen_v1");
  if (s.best && s.best[4]) return "4×4 最佳 " + s.best[4][0] + " 步";
  return "3×3 / 4×4 / 5×5 三种规格";
}
function lightsProgress() {
  const s = readJSON("lightsout_v1");
  const n = s.best ? Object.keys(s.best).length : 0;
  return "50 关" + (n ? " · 已通 " + n : " · 把灯全关掉");
}

/* ---------- 图标 ---------- */
function makeIcon(draw) {
  const c = document.createElement("canvas");
  c.width = 40; c.height = 40;
  c.style.width = "48px"; c.style.height = "48px";
  const g = c.getContext("2d");
  g.fillStyle = PAL[1]; g.fillRect(0, 0, 40, 40);
  draw(g);
  return c;
}
const icons = {
  sokoban: makeIcon(g => { // 木箱
    g.fillStyle = PAL[3]; g.fillRect(6, 6, 28, 28);
    g.fillStyle = PAL[1]; g.fillRect(9, 9, 22, 22);
    g.fillStyle = PAL[2];
    for (let i = 0; i < 16; i++) { g.fillRect(11 + i, 11 + i, 2, 2); g.fillRect(27 - i, 11 + i, 2, 2); }
    g.fillStyle = PAL[3];
    g.fillRect(8, 8, 3, 3); g.fillRect(29, 8, 3, 3); g.fillRect(8, 29, 3, 3); g.fillRect(29, 29, 3, 3);
  }),
  klotski: makeIcon(g => { // 曹操 + 兵
    g.fillStyle = PAL[3]; g.fillRect(11, 5, 18, 18);
    g.fillStyle = PAL[2]; g.fillRect(4, 5, 5, 18); g.fillRect(31, 5, 5, 18);
    g.fillRect(4, 25, 14, 8); g.fillRect(22, 25, 14, 8);
    g.fillStyle = PAL[0]; g.fillRect(15, 9, 3, 3); g.fillRect(22, 9, 3, 3);
    g.fillRect(15, 16, 10, 2);
  }),
  fifteen: makeIcon(g => { // 数字块
    const t = [[4, 4, "1"], [21, 4, "2"], [4, 21, "3"]];
    for (const [x, y] of t) { g.fillStyle = PAL[3]; g.fillRect(x, y, 15, 15); g.fillStyle = PAL[0]; g.fillRect(x + 1, y + 1, 13, 13); }
    g.fillStyle = PAL[3];
    g.fillRect(10, 7, 2, 9); g.fillRect(8, 14, 6, 2);
    g.fillRect(25, 7, 6, 2); g.fillRect(29, 9, 2, 3); g.fillRect(25, 12, 6, 2); g.fillRect(25, 14, 2, 1); g.fillRect(25, 15, 6, 1);
    g.fillRect(8, 24, 6, 2); g.fillRect(12, 26, 2, 2); g.fillRect(8, 28, 6, 2); g.fillRect(12, 30, 2, 2); g.fillRect(8, 32, 6, 2);
  }),
  lightsout: makeIcon(g => { // 十字亮灯
    for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) {
      const lit = (x === 1) !== (y === 1) || (x === 1 && y === 1);
      const px = 5 + x * 11, py = 5 + y * 11;
      g.fillStyle = PAL[3]; g.fillRect(px, py, 9, 9);
      g.fillStyle = lit ? PAL[0] : PAL[2]; g.fillRect(px + 1, py + 1, 7, 7);
      if (lit) { g.fillStyle = PAL[1]; g.fillRect(px + 3, py + 3, 3, 3); }
    }
  }),
};

/* ---------- 菜单 ---------- */
const GAMES = [
  { href: "sokoban.html", icon: icons.sokoban, name: "推箱子", en: "SOKOBAN", sub: sokoProgress },
  { href: "klotski.html", icon: icons.klotski, name: "华容道", en: "KLOTSKI", sub: klotskiProgress },
  { href: "fifteen.html", icon: icons.fifteen, name: "数字华容道", en: "15 PUZZLE", sub: fifteenProgress },
  { href: "lightsout.html", icon: icons.lightsout, name: "关灯游戏", en: "LIGHTS OUT", sub: lightsProgress },
];
let sel = 0;
const menuEl = document.getElementById("menu");

GAMES.forEach((g, i) => {
  const it = document.createElement("div");
  it.className = "item";
  it.appendChild(g.icon);
  const txt = document.createElement("div");
  txt.className = "txt";
  txt.innerHTML = '<div class="name">' + g.name + '<span class="en">' + g.en + '</span></div>' +
                  '<div class="sub">' + g.sub() + "</div>";
  it.appendChild(txt);
  const mk = document.createElement("div");
  mk.className = "marker";
  mk.textContent = "▶";
  it.appendChild(mk);
  it.addEventListener("pointerenter", () => { if (sel !== i) { sel = i; refresh(); } });
  it.addEventListener("click", () => { sel = i; launch(); });
  menuEl.appendChild(it);
});

function refresh() {
  [...menuEl.children].forEach((el, i) => el.classList.toggle("sel", i === sel));
}
function launch() {
  SND.enter();
  const href = GAMES[sel].href;
  setTimeout(() => { location.href = href; }, 120);
}
function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFullscreen() {
  if (isFullscreen()) (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
  else {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) req.call(el);
  }
}

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  SND.unlock();
  switch (e.key) {
    case "ArrowUp": case "w": case "W": e.preventDefault(); sel = (sel + GAMES.length - 1) % GAMES.length; SND.nav(); refresh(); break;
    case "ArrowDown": case "s": case "S": e.preventDefault(); sel = (sel + 1) % GAMES.length; SND.nav(); refresh(); break;
    case "Enter": case " ": e.preventDefault(); launch(); break;
    case "f": case "F": e.preventDefault(); toggleFullscreen(); break;
    case "m": case "M":
      e.preventDefault();
      muted = !muted;
      try { localStorage.setItem("hh_muted", muted ? "1" : "0"); } catch (err) {}
      if (!muted) SND.nav();
      break;
  }
});
refresh();
</script>
</body>
</html>
