<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数字华容道 · POCKET 2000</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(140% 120% at 50% 38%, #a4c31d 0%, #9bbc0f 55%, #83a40d 100%);
    color: #0f380f;
    font-family: "PingFang SC", "Microsoft YaHei", ui-monospace, Menlo, monospace;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .screen {
    position: fixed; inset: 0 0 32px 0;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .hintbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 32px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-size: 12px; color: rgba(15,56,15,.72); letter-spacing: .03em;
    padding: 0 12px; white-space: nowrap; overflow: hidden;
  }
  .hintbar b { color: #0f380f; font-weight: 600; }
  .hintbar .sep { opacity: .45; }
  @media (max-width: 640px) { .hintbar .keysHint, .hintbar .sep { display: none; } }
</style>
</head>
<body>
<div class="screen" id="screen"><canvas id="lcd"></canvas></div>
<div class="hintbar">
  <span id="status">加载中…</span>
  <span class="sep">｜</span>
  <span class="keysHint">方向键 / WASD 滑动 · 1 / 2 / 3 换规格 · Z 撤销 · R 重新打乱 · F 全屏 · M 音效 · Esc 菜单</span>
</div>

<script id="core">
"use strict";
/* 数字华容道引擎（纯逻辑）：board 为长度 n*n 的数组，0 表示空格 */
const FIFT = (() => {
  function solved(n) {
    const b = [];
    for (let i = 1; i < n * n; i++) b.push(i);
    b.push(0);
    return b;
  }
  function isSolved(b) {
    for (let i = 0; i < b.length - 1; i++) if (b[i] !== i + 1) return false;
    return b[b.length - 1] === 0;
  }
  // dir：滑块移动的方向。U = 空格下方的滑块向上滑入空格。
  // 返回滑动的格子下标，不能动返回 -1。
  function slide(b, n, dir) {
    const bi = b.indexOf(0);
    const bx = bi % n, by = (bi / n) | 0;
    let tx = bx, ty = by;
    if (dir === "U") ty = by + 1;
    else if (dir === "D") ty = by - 1;
    else if (dir === "L") tx = bx + 1;
    else if (dir === "R") tx = bx - 1;
    if (tx < 0 || ty < 0 || tx >= n || ty >= n) return -1;
    const ti = ty * n + tx;
    b[bi] = b[ti];
    b[ti] = 0;
    return ti;
  }
  const OPP = { U: "D", D: "U", L: "R", R: "L" };
  // 从还原态随机游走打乱（天然可解），避免立即回退；返回 {board, seq}
  function scramble(n, steps, rand) {
    const b = solved(n);
    const seq = [];
    let last = "";
    let guard = 0;
    while (seq.length < steps && guard < steps * 20) {
      guard++;
      const dir = "UDLR"[(rand() * 4) | 0];
      if (dir === OPP[last]) continue;
      const tmp = b.slice();
      if (slide(tmp, n, dir) < 0) continue;
      slide(b, n, dir);
      seq.push(dir);
      last = dir;
    }
    if (isSolved(b)) { // 极小概率转回原点，再走几步
      for (const d of ["U", "L", "U", "L"]) if (slide(b, n, d) >= 0) seq.push(d);
    }
    return { board: b, seq };
  }
  return { solved, isSolved, slide, scramble, OPP };
})();
if (typeof module !== "undefined") module.exports = { FIFT };
</script>

<script>
"use strict";
/* ---------- 调色板 / 位图字体 ---------- */
const PAL = ["#9bbc0f", "#8bac0f", "#306230", "#0f380f"];
const FONT = {
  "0":"111101101101111","1":"010110010010111","2":"111001111100111","3":"111001011001111",
  "4":"101101111001001","5":"111100111001111","6":"111100111101111","7":"111001010010010",
  "8":"111101111101111","9":"111101111001111",
  "A":"010101111101101","B":"110101110101110","C":"011100100100011","D":"110101101101110",
  "E":"111100110100111","F":"111100110100100","G":"011100101101011","H":"101101111101101",
  "I":"111010010010111","J":"001001001101010","K":"101110100110101","L":"100100100100111",
  "M":"101111111101101","N":"110101101101101","O":"010101101101010","P":"110101110100100",
  "Q":"010101101011001","R":"110101110110101","S":"011100010001110","T":"111010010010010",
  "U":"101101101101111","V":"101101101101010","W":"101101111111101","X":"101101010101101",
  "Y":"101101010010010","Z":"111001010100111",
  " ":"000000000000000",":":"000010000010000","/":"001001010100100","-":"000000111000000",
  "!":"010010010000010",".":"000000000000010",">":"100010001010100","*":"000101010101000",
};
function drawText(g, str, x, y, col, scale) {
  scale = scale || 1;
  g.fillStyle = PAL[col];
  for (const ch of String(str).toUpperCase()) {
    const bits = FONT[ch] || FONT[" "];
    for (let i = 0; i < 15; i++) {
      if (bits[i] === "1") g.fillRect(x + (i % 3) * scale, y + ((i / 3) | 0) * scale, scale, scale);
    }
    x += 4 * scale;
  }
  return x;
}
const textW = (str, scale) => String(str).length * 4 * (scale || 1) - (scale || 1);

/* ---------- 音效 ---------- */
const SND = (() => {
  let ctx = null;
  function ensure() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, dur, delay, type, vol) {
    const c = ensure(); if (!c || game.muted) return;
    const t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator(), gn = c.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    gn.gain.setValueAtTime(vol || 0.04, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  return {
    unlock: ensure,
    move()  { tone(700, 0.035); },
    bump()  { tone(100, 0.06, 0, "sawtooth", 0.05); },
    undo()  { tone(520, 0.04); tone(390, 0.04, 0.05); },
    select(){ tone(660, 0.05); },
    win()   { [523, 659, 784, 988, 1319].forEach((f, i) => tone(f, 0.14, i * 0.1, "square", 0.05)); },
  };
})();

/* ---------- 存档 ---------- */
const STORE_KEY = "fifteen_v1";
function loadStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }
function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
const store = loadStore();
store.best = store.best || {};   // best[n] = [moves, seconds]
if (![3, 4, 5].includes(store.size)) store.size = 4;

/* ---------- 游戏状态 ---------- */
const T = 24, HUD_H = 14, PAD = 4;
const SCRAMBLE_STEPS = { 3: 160, 4: 420, 5: 900 };

const cv = document.getElementById("lcd");
const g2 = cv.getContext("2d");
const screenBox = document.getElementById("screen");
const statusEl = document.getElementById("status");

const game = {
  n: store.size,
  board: [],
  scrambleSeq: [],
  moves: 0,
  seconds: 0,
  running: false,
  history: [],
  won: false,
  newBest: false,
  blink: true,
  muted: (function () { try { return localStorage.getItem("hh_muted") === "1"; } catch (e) { return false; } })(),
};
let blinkTimer = null;

setInterval(() => {
  if (game.running && !game.won) { game.seconds++; render(); }
}, 1000);

function newGame(n) {
  game.n = n;
  store.size = n;
  saveStore();
  const r = FIFT.scramble(n, SCRAMBLE_STEPS[n], Math.random);
  game.board = r.board;
  game.scrambleSeq = r.seq;
  game.moves = 0;
  game.seconds = 0;
  game.running = false;
  game.history = [];
  game.won = false;
  game.newBest = false;
  clearInterval(blinkTimer); blinkTimer = null;
  layout();
  render();
  updateStatus();
}

function updateStatus() {
  const b = store.best[game.n];
  statusEl.innerHTML =
    "<b>数字华容道</b> · " + game.n + "×" + game.n +
    (b ? " · 最佳 <b>" + b[0] + "</b> 步 / " + fmtT(b[1]) : " · 尚无纪录") +
    (game.muted ? " · 已静音" : "");
}

function fmtT(s) {
  return String((s / 60) | 0).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

/* ---------- 渲染 ---------- */
function nativeSize() {
  const w = game.n * T + PAD * 2;
  return [Math.max(w, 88), w + HUD_H + PAD];
}
function layout() {
  const [nw, nh] = nativeSize();
  cv.width = nw; cv.height = nh;
  const availW = screenBox.clientWidth - 8, availH = screenBox.clientHeight - 8;
  let scale = Math.min(availW / nw, availH / nh);
  if (scale >= 1) scale = Math.floor(scale);
  cv.style.width = nw * scale + "px";
  cv.style.height = nh * scale + "px";
}

function render() {
  const n = game.n;
  const [nw, nh] = nativeSize();
  g2.fillStyle = PAL[0];
  g2.fillRect(0, 0, nw, nh);

  drawText(g2, n + "X" + n, 3, 4, 3);
  const right = "M" + String(game.moves).padStart(4, "0") + " T" + fmtT(game.seconds);
  drawText(g2, right, nw - textW(right, 1) - 3, 4, 3);
  g2.fillStyle = PAL[2];
  g2.fillRect(0, HUD_H - 2, nw, 1);

  const ox = Math.floor((nw - n * T) / 2), oy = HUD_H + 2;
  g2.fillStyle = PAL[3];
  g2.fillRect(ox - 2, oy - 2, n * T + 4, n * T + 4);
  g2.fillStyle = PAL[1];
  g2.fillRect(ox - 1, oy - 1, n * T + 2, n * T + 2);

  for (let i = 0; i < n * n; i++) {
    const v = game.board[i];
    const x = ox + (i % n) * T, y = oy + ((i / n) | 0) * T;
    if (v === 0) { g2.fillStyle = PAL[1]; g2.fillRect(x, y, T, T); continue; }
    g2.fillStyle = PAL[3]; g2.fillRect(x, y, T, T);
    g2.fillStyle = PAL[v === i + 1 ? 0 : 1]; g2.fillRect(x + 1, y + 1, T - 2, T - 2);
    g2.fillStyle = PAL[2];
    g2.fillRect(x + 1, y + T - 3, T - 2, 2);
    g2.fillRect(x + T - 3, y + 1, 2, T - 2);
    const s = String(v);
    drawText(g2, s, x + Math.floor((T - textW(s, 2)) / 2), y + Math.floor((T - 10) / 2), 3, 2);
  }

  if (game.won) {
    const bw = Math.min(nw - 6, 116), bh = 46;
    const bx = Math.floor((nw - bw) / 2), by = Math.floor((nh - bh) / 2);
    g2.fillStyle = PAL[0]; g2.fillRect(bx, by, bw, bh);
    g2.fillStyle = PAL[3];
    g2.fillRect(bx, by, bw, 1); g2.fillRect(bx, by + bh - 1, bw, 1);
    g2.fillRect(bx, by, 1, bh); g2.fillRect(bx + bw - 1, by, 1, bh);
    g2.fillStyle = PAL[2]; g2.fillRect(bx + 2, by + 2, bw - 4, 1); g2.fillRect(bx + 2, by + bh - 3, bw - 4, 1);
    let t = "CLEAR!";
    drawText(g2, t, Math.floor((nw - textW(t, 2)) / 2), by + 6, 3, 2);
    t = "M " + game.moves + " T " + fmtT(game.seconds) + (game.newBest ? " *" : "");
    drawText(g2, t, Math.floor((nw - textW(t, 1)) / 2), by + 23, 3);
    if (game.blink) {
      t = "> PRESS ANY KEY";
      drawText(g2, t, Math.floor((nw - textW(t, 1)) / 2), by + 34, 2);
    }
  }
}

/* ---------- 操作 ---------- */
function doSlide(dir, countIt) {
  if (game.won) return;
  const ti = FIFT.slide(game.board, game.n, dir);
  if (ti < 0) { if (countIt) SND.bump(); return; }
  if (countIt) {
    game.moves++;
    game.history.push(dir);
    game.running = true;
    SND.move();
  }
  render();
  if (countIt && FIFT.isSolved(game.board)) handleWin();
}

function doUndo() {
  if (game.won) return;
  const dir = game.history.pop();
  if (!dir) { SND.bump(); return; }
  FIFT.slide(game.board, game.n, FIFT.OPP[dir]);
  game.moves--;
  SND.undo();
  render();
}

function handleWin() {
  game.won = true;
  game.running = false;
  const prev = store.best[game.n];
  if (!prev || game.moves < prev[0] || (game.moves === prev[0] && game.seconds < prev[1])) {
    store.best[game.n] = [game.moves, game.seconds];
    game.newBest = !!prev;
    saveStore();
  }
  SND.win();
  updateStatus();
  game.blink = true;
  blinkTimer = setInterval(() => { game.blink = !game.blink; render(); }, 480);
  render();
}

/* ---------- 键盘 ---------- */
function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFullscreen() {
  if (isFullscreen()) (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
  else {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) req.call(el);
  }
}
["fullscreenchange", "webkitfullscreenchange"].forEach(ev =>
  document.addEventListener(ev, () => { layout(); render(); }));

function toggleMute() {
  game.muted = !game.muted;
  try { localStorage.setItem("hh_muted", game.muted ? "1" : "0"); } catch (e) {}
  updateStatus();
  if (!game.muted) SND.select();
}

const KEYMAP = {
  ArrowUp: "U", ArrowDown: "D", ArrowLeft: "L", ArrowRight: "R",
  w: "U", s: "D", a: "L", d: "R", W: "U", S: "D", A: "L", D: "R",
};

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  SND.unlock();
  if (game.won) {
    e.preventDefault();
    if (e.key === "f" || e.key === "F") { toggleFullscreen(); return; }
    if (e.key === "m" || e.key === "M") { toggleMute(); return; }
    if (e.key === "Escape") { if (!isFullscreen()) location.href = "./"; return; }
    newGame(game.n);
    return;
  }
  const dir = KEYMAP[e.key];
  if (dir) { e.preventDefault(); doSlide(dir, true); return; }
  switch (e.key) {
    case "1": e.preventDefault(); SND.select(); newGame(3); break;
    case "2": e.preventDefault(); SND.select(); newGame(4); break;
    case "3": e.preventDefault(); SND.select(); newGame(5); break;
    case "z": case "Z": case "u": case "U": case "Backspace": e.preventDefault(); doUndo(); break;
    case "r": case "R": e.preventDefault(); SND.select(); newGame(game.n); break;
    case "f": case "F": e.preventDefault(); toggleFullscreen(); break;
    case "m": case "M": e.preventDefault(); toggleMute(); break;
    case "Escape":
      e.preventDefault();
      if (!isFullscreen()) location.href = "./";
      break;
  }
});

/* ---------- 指针：点击与空格相邻的滑块 ---------- */
screenBox.addEventListener("pointerdown", e => {
  SND.unlock();
  if (game.won) { newGame(game.n); return; }
  const rect = cv.getBoundingClientRect();
  const n = game.n;
  const [nw] = nativeSize();
  const scale = rect.width / nw;
  const ox = Math.floor((nw - n * T) / 2), oy = HUD_H + 2;
  const x = Math.floor((e.clientX - rect.left) / scale - ox);
  const y = Math.floor((e.clientY - rect.top) / scale - oy);
  const cx = Math.floor(x / T), cy = Math.floor(y / T);
  if (cx < 0 || cy < 0 || cx >= n || cy >= n) return;
  const bi = game.board.indexOf(0);
  const bx = bi % n, by = (bi / n) | 0;
  if (Math.abs(cx - bx) + Math.abs(cy - by) !== 1) return;
  const dir = cx === bx ? (cy > by ? "U" : "D") : (cx > bx ? "L" : "R");
  doSlide(dir, true);
});

/* ---------- 启动 ---------- */
window.addEventListener("resize", () => { layout(); render(); });
newGame(game.n);
</script>
</body>
</html>
